# Rebuilds the cells every week and on demand; commits and publishes only when a cell changed.
# GitHub's cron runs in UTC: 13:00 UTC is 06:00 Pacific in summer (PDT), 05:00 in winter (PST).
name: refresh
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (fresh downloads; the City live)
        run: node build/build.js --fresh | tee build.log
      - name: Check
        run: node build/check.js --sites | tee -a build.log
      - name: Commit if a cell changed
        id: commit
        run: |
          git add -A cells index.json fixtures
          if git diff --cached --quiet; then echo "No cell changed." | tee -a build.log; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh cells $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish (a push with this workflow's token does not start a Pages build by itself)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
